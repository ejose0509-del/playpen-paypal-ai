<button type="button" class="world-marker well-marker" id="well-marker">{{ icon("leaf", 15) }} <span id="well-label">Old well</span></button>
<div class="well-ceremony" id="well-ceremony" aria-hidden="true" hidden>
  <span class="well-glow"></span>
  <i class="well-ripple"></i><i class="well-ripple"></i><i class="well-ripple"></i>
  <span class="well-coin"></span>
  <span class="well-sparks"><i></i><i></i><i></i><i></i><i></i><i></i></span>
</div>
<button type="button" class="world-marker stall-marker" data-dialog="shop">{{ icon("shop", 15) }} <span>Market stall</span></button>

<button type="button" class="world-marker barn-marker" id="barn-marker" data-dialog="repair-yard">
  {{ icon("repair", 17) }} <span>{{ "Barn restored" if "barn" in farm.repairs else "Old barn" }}</span>
</button>

<button type="button" class="world-actor visitor-actor" id="world-visitor" data-dialog="visitor-panel" aria-label="Talk to {{ visitors[farm.visitor_order.visitor].name }}">
  {{ crop_sprite(farm.visitor_order.visitor, "actor-art") }}
  <span class="actor-tag"><strong>{{ visitors[farm.visitor_order.visitor].name }}</strong><small>Village order</small></span>
</button>

{% for kind, animal in farm.animals.items() %}
  <button type="button" class="world-actor animal-actor actor-{{ kind }}" id="world-{{ kind }}" data-dialog="animal-{{ kind }}"
    aria-label="Visit {{ animal.name }} the {{ animal.kind | lower }}"{% if not animal.unlocked %} hidden{% endif %}>
    {{ crop_sprite(kind, "actor-art") }}
    <span class="actor-tag"><strong>{{ animal.name }}</strong><small data-animal-map-status="{{ kind }}">Hungry</small></span>
  </button>
{% endfor %}

<button type="button" class="world-actor orchard-actor" id="world-orchard" data-dialog="repair-yard"
  aria-label="Visit the restored orchard"{% if "orchard" not in farm.repairs %} hidden{% endif %}>
  {{ crop_sprite("orchard", "actor-art") }}
  <span class="actor-tag"><strong>Apple orchard</strong></span>
</button>
